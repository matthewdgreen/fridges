name: Update and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'
permissions:
  contents: read
concurrency:
  group: fridges-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check data and collection behavior
        run: python -m unittest discover -s tests -v
      - name: Collect today's aggregate count
        if: github.event_name != 'push'
        env:
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
        run: python scripts/refresh.py
      - name: Validate updated data
        run: python scripts/validate.py
      - name: Preserve daily history
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/shodan.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily Shodan aggregate count"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  health:
    if: github.event_name != 'push'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Flag failed collection after publishing its status
        run: |
          python -c "import json; d=json.load(open('site/data/shodan.json')); assert d['status'] != 'error', 'Shodan refresh failed; last successful data was preserved and published'"
