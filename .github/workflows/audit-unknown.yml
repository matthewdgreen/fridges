name: Audit cached unknown firmware
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test audit aggregation
        run: python -m unittest discover -s tests -v
      - name: Inspect cached Shodan metadata
        env:
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
        run: python -m scripts.audit_unknown_versions --output research/unknown-firmware-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: unknown-firmware-aggregates
          path: research/unknown-firmware-audit.json
          retention-days: 7
