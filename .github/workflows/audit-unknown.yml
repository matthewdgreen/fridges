name: Audit cached unknown firmware
on:
  workflow_dispatch:
    inputs:
      public_key:
        description: Optional public key for encrypting the two busiest addresses
        type: string
        required: false
      max_hosts:
        description: Maximum cached host lookups
        type: number
        default: 100
      history_only:
        description: Inspect historical cached banners for the two excluded addresses only
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test audit aggregation
        run: python -m unittest discover -s tests -v
      - name: Inspect cached Shodan metadata
        env:
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
          AUDIT_PUBLIC_KEY: ${{ inputs.public_key }}
          AUDIT_MAX_HOSTS: ${{ inputs.max_hosts }}
          AUDIT_HISTORY_ONLY: ${{ inputs.history_only }}
          EXCLUDED_STOREVIEW_IPS: ${{ secrets.EXCLUDED_STOREVIEW_IPS }}
        run: python -m scripts.audit_unknown_versions --output research/unknown-firmware-audit.json --max-hosts "$AUDIT_MAX_HOSTS"
      - uses: actions/upload-artifact@v4
        with:
          name: unknown-firmware-aggregates
          path: |
            research/unknown-firmware-audit.json
            research/unknown-firmware-audit.enc
          retention-days: 7
